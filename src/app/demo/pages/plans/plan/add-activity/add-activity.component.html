<div class="main-content" style="padding: 24px 32px;">
  <div class="row align-items-center mb-3 pb-2 border-bottom">
    <div class="col-11">
      <h4 class="m-0 font-weight-bold" style="color: #1e293b;">{{title}}</h4>
      <small class="text-muted">Crea y gestiona las actividades asociadas a este plan de acción.</small>
    </div>
    <div class="col-1 text-end">
      <button mat-icon-button class="delete-color" matTooltip="Cerrar" (click)="closeModal()"> 
        <mat-icon class="font-weight-boldest">close</mat-icon>
      </button>
    </div>
  </div> 

  <form [formGroup]="form">
    <div class="row mb-2">
      <div class="col-12">
        <mat-form-field class="w-100">
          <mat-label>Actividad</mat-label>
          <textarea matInput formControlName="activity" rows="2" maxlength="500" placeholder="500 caracteres máximo"></textarea>
        </mat-form-field>
      </div>
    </div>

    <div class="row align-items-center mb-3">
      <div class="col-md-9 col-8">
        <mat-form-field class="w-100">
          <mat-label>Asignar actividad a</mat-label>
          <input type="text"
            matInput
            placeholder="Escribe para buscar responsable..."
            [formControl]="responsibleSearchCtrl"
            [matAutocomplete]="autoResponsible">
          <button *ngIf="f.responsible.value || responsibleSearchCtrl.value" matSuffix mat-icon-button
            aria-label="Limpiar" (click)="clearResponsibleSearch($event)" type="button">
            <mat-icon>close</mat-icon>
          </button>
          <mat-autocomplete #autoResponsible="matAutocomplete" [displayWith]="displayResponsibleFn"
            (optionSelected)="onResponsibleSelected($event)">
            <mat-option *ngFor="let user of filteredResponsibles$ | async" [value]="user">
              {{user.fullName}} <small class="text-muted" *ngIf="user.position"> - {{user.position}}</small>
            </mat-option>
          </mat-autocomplete>
        </mat-form-field>
      </div>

      <div class="col-md-3 col-4 d-flex align-items-center justify-content-end mb-3">
        <button mat-raised-button [disabled]="loading" class="button-add-color w-100" matTooltip="Guardar Actividad" (click)="addActivity()"> 
          <div class="btn-content">
            <div class="button-txt">
              Guardar
            </div>
            <div class="icon">
              <mat-icon>save</mat-icon>
            </div>
          </div>
        </button>
      </div>
    </div>

    <div class="mat-elevation-z8 mt-2" [hidden]="showListActivity">
      <div class="table-responsive">
        <table mat-table [dataSource]="dataSourceActivity" matSort>
          
          <ng-container matColumnDef="activity">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Actividad</th>
            <td mat-cell *matCellDef="let row"> {{row.activity}} </td>  
          </ng-container>
          <ng-container matColumnDef="userName">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Responsable</th>
            <td mat-cell *matCellDef="let row"> {{row.fullName}} </td>
          </ng-container>
          <ng-container matColumnDef="done">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Concluida</th>
            <td mat-cell *matCellDef="let row">
              <mat-slide-toggle [checked]="row.done" (change)="toggleStatus($event,row)">
              </mat-slide-toggle>
            </td>
          </ng-container>
          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef> Acciones </th>
            <td mat-cell *matCellDef="let row">
              <button mat-icon-button class="delete-color" matTooltip="Eliminar" (click)="onDeleteActivity(row)">
                <mat-icon class="font-weight-boldest">delete</mat-icon>
              </button>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumnsActivity"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumnsActivity" 
            (click)="selectedRow = selectedRow === row ? null : row" [ngClass]="{ 'selected': row === selectedRow }"
          > 
          </tr>
  
          <tr class="mat-row" *matNoDataRow>
            <td class="mat-cell msg-no-found" colspan="8">No hay datos que coincidan</td>
          </tr>
        </table>
      </div>
    </div>
  </form>
</div>
