<div class="main-content">
    <div class="row">
      <div class="col-11 msg-no-found">
          <h4>{{title}}</h4>
      </div>
      <div class="col-1 align-right">
          <button mat-icon-button class="delete-color" matTooltip="Cerrar"
          (click)="closeModal()"> 
              <mat-icon class="font-weight-boldest">close</mat-icon>
          </button>
      </div>
    </div> 
    <form [formGroup]="form">
           <!-- <div class="col-12 padding-top-input">
              <strong>Actividades del Plan.</strong> <br>
              Crea y gestiona las actividades de este plan.
            </div> -->

            <div class="row">
              <div class="col-12">
                  <mat-form-field>
                      <mat-label>Actividad</mat-label>
                      <textarea matInput formControlName="activity" maxlength="500" placeholder="500 caracteres máximo"></textarea>
                  </mat-form-field>
              </div>
            </div>

            <div class="row">
              <div class="col-6">
                <mat-form-field>
                  <mat-label>Asignar actividad a </mat-label>
                  <mat-select formControlName="responsible">
                    <mat-option *ngFor="let r of responsibles" [value]="r.id"> 
                      {{ r.fullName }}
                    </mat-option>
                  </mat-select>
                </mat-form-field>
              </div>

              <div class="col-6">
                <button mat-icon-button [disabled]="loading" class="edit-color" matTooltip="Guardar"
                  (click)="addActivity()"> 
                    <mat-icon class="font-weight-boldest" >save</mat-icon>
                </button>
              </div>
            </div>

            <div class="mat-elevation-z8" [hidden]="showListActivity">
              <div class="table-responsive">
                <table mat-table [dataSource]="dataSourceActivity" matSort>
                  
                  <ng-container matColumnDef="activity">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header>Actividad</th>
                    <td mat-cell *matCellDef="let row"> {{row.activity}} </td>  
                  </ng-container>
                  <ng-container matColumnDef="userName">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header>Responsable</th>
                    <td mat-cell *matCellDef="let row"> {{row.fullName}} </td>
                  </ng-container>
                  <ng-container matColumnDef="done">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header>Concluida</th>
                    <td mat-cell *matCellDef="let row">
                        <mat-slide-toggle [checked]="row.done"
                          (change)="toggleStatus($event,row)">
                        </mat-slide-toggle>
                    </td>
                  </ng-container>
                  <ng-container matColumnDef="actions">
                    <th mat-header-cell *matHeaderCellDef> Acciones </th>
                    <td mat-cell *matCellDef="let row">
                      <button mat-icon-button class="delete-color" matTooltip="Eliminar"     
                      (click)="onDeleteActivity(row)">
                          <mat-icon class="font-weight-boldest">delete</mat-icon>
                      </button>
                    </td>
                  </ng-container>

                  <tr mat-header-row *matHeaderRowDef="displayedColumnsActivity"></tr>
                  <tr mat-row *matRowDef="let row; columns: displayedColumnsActivity" 
                    (click)="selectedRow = selectedRow === row ? null : row" [ngClass]="{ 'selected': row === selectedRow }"
                  > 
                  </tr>
          
                  <tr class="mat-row" *matNoDataRow>
                    <td class="mat-cell msg-no-found" colspan="8">No hay datos que coincidan"</td>
                  </tr>
                </table>
              </div>
          </div>
    </form>
  </div>
