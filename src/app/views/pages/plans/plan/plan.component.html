<div class="main-content">
  <div class="row header">
      <div class="col-4">
        <nav class="page-breadcrumb">
          <ol class="breadcrumb">
            <li class="breadcrumb-item"><a routerLink=".">Planes de Acción</a></li>
            <li class="breadcrumb-item active" aria-current="page">Listado</li>
          </ol>
        </nav>
      </div>
      <div class="col-8">
        <div class="btn-flex-end">
            <button mat-raised-button class="button-add-color" (click)="openAdd()">
              <div class="btn-content">
                <div class="button-txt">
                  Agregar
                </div>
                <div class="icon">
                  <mat-icon>add_circle_outline</mat-icon>
                </div>
              </div>
            </button>
          </div>
      </div>
    </div>

  <div class="row" [hidden]="loading">
    
    <div class="p-top habladores">Visualiza todos los eventos que se han reportado en tu organización.</div>

    <div class="col-8">
      <div class="filter-class ">
        <mat-form-field appearance="standard">
          <mat-label>Buscar</mat-label>
          <input matInput (keyup)="applyFilter($event)"  #input>
        </mat-form-field>
      </div>
    </div>
 
    <div class="mat-elevation-z8 ">
      <div class="table-responsive">
        <table mat-table [dataSource]="dataSource" matSort>

          <ng-container matColumnDef="id">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>ID</th>
            <td mat-cell *matCellDef="let row"> {{row.id}} </td>
          </ng-container>
          
          <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Nombre</th>
            <td mat-cell *matCellDef="let row"> {{row.name}} </td>
          </ng-container>
          
          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef> Acciones </th>
            <td mat-cell *matCellDef="let row">
              <button mat-icon-button class="edit-color" matTooltip="Editar"     
              (click)="onEdit(row)">
                  <mat-icon class="font-weight-boldest">create</mat-icon>
              </button>
              <button mat-icon-button class="edit-color" matTooltip="Actividades"     
              (click)="addActivity(row)">
                  <mat-icon class="font-weight-boldest">add_circle_outline</mat-icon>
              </button>
              <button mat-icon-button class="edit-color" matTooltip="Responsables"     
              (click)="onResponsible(row)">
                  <mat-icon class="font-weight-boldest">face</mat-icon>
              </button>
              <button mat-icon-button class="edit-color" matTooltip="Riesgos" *ngIf="row.risks && row.risks.length > 0"  
               (click)="onRisks(row)">
                  <mat-icon class="font-weight-boldest">warning</mat-icon>
              </button>
              <button mat-icon-button class="edit-color" matTooltip="Eventos"  *ngIf="row.events && row.events.length > 0"    
               (click)="onEvent(row)">
                  <mat-icon class="font-weight-boldest">filter_none</mat-icon>
              </button>
              <button mat-icon-button class="edit-color" matTooltip="Controles"  *ngIf="row.controls && row.controls.length > 0"   
               (click)="onControl(row)">
                  <mat-icon class="font-weight-boldest">event_note</mat-icon>
              </button>
              <button mat-icon-button class="edit-color" matTooltip="Procesos"   *ngIf="row.processes && row.processes.length > 0"  
               (click)="onProcess(row)">
                  <mat-icon class="font-weight-boldest">transform</mat-icon>
              </button>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns" 
            (click)="selectedRow = selectedRow === row ? null : row" [ngClass]="{ 'selected': row === selectedRow }"
          > 
          </tr>
  
          <tr class="mat-row" *matNoDataRow>
            <td class="mat-cell msg-no-found" colspan="8">No hay datos que coincidan con la busqueda</td>
          </tr>
        </table>
      </div>
      <mat-paginator [pageSizeOptions]="[10, 20]" aria-label="Select page of users"></mat-paginator>
    </div>
  </div>
