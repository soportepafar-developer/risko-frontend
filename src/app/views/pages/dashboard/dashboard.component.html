<div class="container mt-4">

  <!-- Bienvenida centrada -->
  <div class="text-center mb-4" *ngIf="user">
    <h4>Bienvenido {{ user.firstName + ' ' + user.lastName }}</h4>
  </div>

  <!-- Grid de tarjetas centrado -->
  <div class="d-flex justify-content-center">
    <div class="grid-card-container">

      <div class="card">
        <span class="material-icons">assignment</span>
        <div class="text">Procesos: {{ processes }}</div>
      </div>

      <div class="card">
        <span class="material-icons">warning</span>
        <div class="text">Riesgos: {{ risks }}</div>
      </div>

      <div class="card">
        <span class="material-icons">security</span>
        <div class="text">Controles: {{ controls }}</div>
      </div>

      <div class="card">
        <span class="material-icons">event</span>
        <div class="text">Eventos: {{ events }}</div>
      </div>

      <div class="card">
        <span class="material-icons">description</span>
        <div class="text">Planes: {{ plans }}</div>
      </div>

      <div class="card">
        <span class="material-icons">verified_user</span>
        <div class="text">Evaluaciones: {{ evaluations }}</div>
      </div>

    </div>
  </div>

</div>
